name: 'C++ CI/CD (Vector Editor)'

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run application
        run: ./build/LAB6

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-binary
          path: build/LAB6

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run application
        run: .\build\Release\LAB6.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: build/Release/LAB6.exe

  create-release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Rename binaries with version
        run: |
          mv ./artifacts/ubuntu-binary/LAB6 ./artifacts/ubuntu-binary/LAB6-1.0.${{ github.run_number }}-Linux
          mv ./artifacts/windows-binary/LAB6.exe ./artifacts/windows-binary/LAB6-1.0.${{ github.run_number }}-Windows.exe
          chmod +x ./artifacts/ubuntu-binary/LAB6-1.0.${{ github.run_number }}-Linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/ubuntu-binary/LAB6-1.0.${{ github.run_number }}-Linux
            ./artifacts/windows-binary/LAB6-1.0.${{ github.run_number }}-Windows.exe